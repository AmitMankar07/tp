<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <header>
        <h1>Salon Booking</h1>
    </header>
    

    <main>
        <section id="available-slots">
            <h2>Available Slots</h2>
            <ul id="slot-list">
                <!-- slots will be rendered here -->
            </ul>
        </section>
        <section id="booking-form">
            <h2>Book an Appointment</h2>
            <form id="booking-form">
                <label for="service">Service:</label>
                <select id="service" name="service">
                    <option value="">Select a service</option>
                    <!-- services will be rendered here -->
                </select>
                <label for="date">Date:</label>
                <input type="date" id="date" name="date">
                <label for="time">Time:</label>
                <input type="time" id="time" name="time">
                <label for="staff">Staff:</label>
                <select id="staff" name="staff">
                    <option value="">Select a staff member</option>
                    <!-- staff members will be rendered here -->
                </select>
                <button id="book-appointment">Book Appointment</button>
            </form>
        </section>
        <section id="booking-confirmation">
            <!-- booking confirmation message will be rendered here -->
        </section>
    </main>
    <script src="../js/bookingPage.js"></script>
</body>
</html>
