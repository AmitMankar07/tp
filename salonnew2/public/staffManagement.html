<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management</title>
    <link rel="stylesheet" href="./css/staff.css">
</head>
<body>
    <h1>Staff Management</h1>

    <!-- Add Staff Form -->
    <h2>Add Staff</h2>
    <form id="staffForm">
        <input type="text" id="name" placeholder="Name" required><br>
        <input type="text" id="specialization" placeholder="Specialization" required><br>
        <input type="text" id="availability" placeholder="Availability (e.g. 9am-5pm)" required><br>
        <button type="submit">Add Staff</button>
    </form>

    <!-- Assign Services Form -->
    <h2>Assign Services to Staff</h2>
    <form id="assignServicesForm">
        <select id="staffSelect"></select>
        <select id="serviceSelect" multiple></select>
        <button type="submit">Assign Services</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/staff.js"></script>
</body>
</html>
